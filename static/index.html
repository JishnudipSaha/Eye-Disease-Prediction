<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCT Eye Disease Predictor</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.3);
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --purple: #8b5cf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 2.5rem 1rem 1rem;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 0.95rem;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* Upload Zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--card);
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.05);
    box-shadow: 0 0 30px var(--accent-glow);
  }
  .upload-zone .icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
  }
  .upload-zone p {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .upload-zone .browse {
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
  }
  #fileInput { display: none; }

  /* Preview */
  .preview-container {
    margin-top: 1.5rem;
    display: none;
    text-align: center;
  }
  .preview-container img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 12px;
    border: 2px solid var(--border);
  }
  .file-name {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.5rem;
  }

  /* Predict Button */
  .predict-btn {
    display: block;
    width: 100%;
    margin-top: 1.5rem;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .predict-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
  .predict-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .predict-btn .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  .predict-btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results {
    margin-top: 2rem;
    display: none;
  }
  .result-card {
    background: var(--card);
    border-radius: 16px;
    padding: 2rem;
    border: 1px solid var(--border);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .result-header .label { color: var(--muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
  .result-header .disease-name {
    font-size: 2rem;
    font-weight: 700;
    margin-top: 0.3rem;
  }
  .result-header .disease-name.CNV { color: var(--red); }
  .result-header .disease-name.DME { color: var(--yellow); }
  .result-header .disease-name.DRUSEN { color: var(--purple); }
  .result-header .disease-name.NORMAL { color: var(--green); }

  /* Confidence Bars */
  .confidence-section { margin-top: 1.5rem; }
  .confidence-section h3 { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 0.8rem;
  }
  .bar-label {
    width: 70px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }
  .bar-track {
    flex: 1;
    height: 28px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 1s ease;
    display: flex;
    align-items: center;
    padding-left: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #fff;
    min-width: fit-content;
  }
  .bar-fill.CNV { background: linear-gradient(90deg, var(--red), #f87171); }
  .bar-fill.DME { background: linear-gradient(90deg, var(--yellow), #fbbf24); }
  .bar-fill.DRUSEN { background: linear-gradient(90deg, var(--purple), #a78bfa); }
  .bar-fill.NORMAL { background: linear-gradient(90deg, var(--green), #34d399); }

  /* Recommendation */
  .recommendation {
    margin-top: 1.5rem;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .recommendation summary {
    padding: 1rem 1.5rem;
    cursor: pointer;
    font-weight: 600;
    color: var(--accent);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
  }
  .recommendation summary:hover { background: rgba(59, 130, 246, 0.05); }
  .recommendation summary::after { content: '+'; font-size: 1.3rem; transition: transform 0.3s; }
  .recommendation[open] summary::after { transform: rotate(45deg); }
  .recommendation .content {
    padding: 0 1.5rem 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.7;
  }
  .recommendation .content strong { color: var(--text); }
  .recommendation .content ul { margin: 0.5rem 0 0.5rem 1.2rem; }
  .recommendation .content li { margin-bottom: 0.3rem; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>OCT Eye Disease Predictor</h1>
  <p>Upload a retinal OCT scan to detect eye diseases using AI</p>
</div>

<div class="container">
  <!-- Upload Zone -->
  <div class="upload-zone" id="uploadZone">
    <span class="icon">&#128065;</span>
    <p>Drag & drop an OCT image here or <span class="browse" id="browseBtn">browse files</span></p>
    <p style="font-size:0.8rem; margin-top:0.5rem; color:#475569;">Supports JPEG, PNG</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Preview -->
  <div class="preview-container" id="previewContainer">
    <img id="previewImg" src="" alt="Preview">
    <p class="file-name" id="fileName"></p>
  </div>

  <!-- Predict Button -->
  <button class="predict-btn" id="predictBtn" disabled>
    <span class="spinner"></span>
    Analyze Scan
  </button>

  <!-- Results -->
  <div class="results" id="results">
    <div class="result-card">
      <div class="result-header">
        <div class="label">Diagnosis</div>
        <div class="disease-name" id="diseaseName"></div>
      </div>
      <div class="confidence-section">
        <h3>Confidence Scores</h3>
        <div id="bars"></div>
      </div>
    </div>

    <details class="recommendation" id="recoSection">
      <summary>Medical Recommendations</summary>
      <div class="content" id="recoContent"></div>
    </details>
  </div>
</div>

<div class="footer">
  OCT Eye Disease Predictor &mdash; Powered by MobileNetV3 Deep Learning
</div>

<script>
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const browseBtn = document.getElementById('browseBtn');
const previewContainer = document.getElementById('previewContainer');
const previewImg = document.getElementById('previewImg');
const fileName = document.getElementById('fileName');
const predictBtn = document.getElementById('predictBtn');
const results = document.getElementById('results');
const diseaseName = document.getElementById('diseaseName');
const bars = document.getElementById('bars');
const recoSection = document.getElementById('recoSection');
const recoContent = document.getElementById('recoContent');

let selectedFile = null;

// Drag & drop
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

browseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  fileName.textContent = file.name;
  previewContainer.style.display = 'block';
  predictBtn.disabled = false;
  results.style.display = 'none';
}

// Predict
predictBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  predictBtn.classList.add('loading');
  predictBtn.disabled = true;
  predictBtn.childNodes[predictBtn.childNodes.length - 1].textContent = ' Analyzing...';

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const res = await fetch('/predict', { method: 'POST', body: formData });
    const data = await res.json();
    showResults(data);
  } catch (err) {
    alert('Prediction failed: ' + err.message);
  } finally {
    predictBtn.classList.remove('loading');
    predictBtn.disabled = false;
    predictBtn.childNodes[predictBtn.childNodes.length - 1].textContent = ' Analyze Scan';
  }
});

function showResults(data) {
  // Disease name
  diseaseName.textContent = data.prediction;
  diseaseName.className = 'disease-name ' + data.prediction;

  // Confidence bars
  bars.innerHTML = '';
  const sorted = Object.entries(data.confidence).sort((a, b) => b[1] - a[1]);
  for (const [cls, pct] of sorted) {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <span class="bar-label">${cls}</span>
      <div class="bar-track">
        <div class="bar-fill ${cls}" style="width: 0%">${pct}%</div>
      </div>`;
    bars.appendChild(row);
    // Animate bar width
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        row.querySelector('.bar-fill').style.width = Math.max(pct, 8) + '%';
      });
    });
  }

  // Recommendation (convert markdown-ish to HTML)
  recoContent.innerHTML = formatRecommendation(data.recommendation);
  recoSection.open = false;

  results.style.display = 'block';
  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function formatRecommendation(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/- (.*?)(?=\n|$)/g, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>');
}
</script>
</body>
</html>
